<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b6cb7"/>
      <stop offset="100%" stop-color="#182848"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bgGrad)" />

  <!-- Letter A made from lines -->
  <line x1="70" y1="200" x2="128" y2="60" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <line x1="186" y1="200" x2="128" y2="60" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <line x1="100" y1="150" x2="156" y2="150" stroke="white" stroke-width="18" stroke-linecap="round"/>

  <!-- Letter Y made from lines, overlapping A on the right side -->
  <line x1="70" y1="60" x2="99" y2="140" stroke="white" stroke-width="20" stroke-linecap="round"/>
</svg>
